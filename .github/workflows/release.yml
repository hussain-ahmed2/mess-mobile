name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name, for example 1.0.0 (defaults to the tag)'
        required: false
        type: string
      version_code:
        description: 'Android version code, must increase with every release'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # The runner image already ships an Android SDK, only the packages the build needs are
      # installed. `android-actions/setup-android` is not used, it fails on current images
      # because it tries to install the `tools` package that no longer exists.
      - name: Set up the Android SDK
        run: |
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          fi
          SDKMANAGER="$(ls -d "${ANDROID_HOME}"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::No sdkmanager found in ${ANDROID_HOME}"
            exit 1
          fi
          echo "Using $SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME}/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: yes | "$SDKMANAGER" --licenses > /dev/null

      - name: Install Android SDK packages
        run: '"$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version_name="$INPUT_VERSION_NAME"
            version_code="$INPUT_VERSION_CODE"
          else
            version_name="${GITHUB_REF_NAME#v}"
            version_code=""
          fi
          if [ -z "$version_name" ]; then
            version_name="1.0.0"
          fi
          if [ -z "$version_code" ]; then
            version_code="${GITHUB_RUN_NUMBER}"
          fi
          echo "version_name=$version_name" >> "$GITHUB_ENV"
          echo "version_code=$version_code" >> "$GITHUB_ENV"
          echo "Building $version_name (versionCode $version_code)"

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for secret in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!secret}" ]; then
              echo "::error::Repository secret $secret is not configured"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"

      - name: Build the release APK
        run: ./gradlew assembleRelease -PversionName="$version_name" -PversionCode="$version_code"

      # The release APK is built unsigned and signed here, so the keystore never has to be
      # part of the Gradle configuration.
      - name: Sign the APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$RUNNER_TEMP/apk/mess-mobile-$version_name-$version_code.apk" \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Verify the signature
        run: |
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs \
            "$RUNNER_TEMP/apk/mess-mobile-$version_name-$version_code.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: mess-mobile-release-apk
          path: ${{ runner.temp }}/apk/*.apk
          if-no-files-found: error

      - name: Upload mapping file
        uses: actions/upload-artifact@v7
        with:
          name: mess-mobile-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "$RUNNER_TEMP"/apk/mess-mobile-*.apk \
            app/build/outputs/mapping/release/mapping.txt \
            --title "mess-mobile ${GITHUB_REF_NAME#v}" \
            --generate-notes
